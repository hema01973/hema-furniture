# Hema033 FIX [MED-05]: Redis password is set via ACL config file rather than
# command-line argument, preventing the password from appearing in `ps aux`
# or /proc/[pid]/cmdline on the host — visible to any user who can list processes.
appendonly yes
requirepass REDIS_PASSWORD_PLACEHOLDER
# Note: In production, replace REDIS_PASSWORD_PLACEHOLDER at deploy time
# or use Docker secrets / an entrypoint script that injects the password.
